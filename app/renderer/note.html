<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>메모</title>
  <style>
    /* 서체 토큰. list.html / setup-email.html 과 같은 값이다. style-src 가
       'unsafe-inline' 뿐이라 공통 .css 파일을 <link> 로 못 부른다. 웹폰트도
       쓰지 않는다 — 이 앱은 오프라인에서 떠야 한다.

       사용자가 고르는 서체 설정은 이제 이 창에도 붙어 있다. 예전 주석이 적어
       두었던 그대로 붙였다:
         1) <script src="font-settings.js"> 를 note.js 보다 먼저 두고,
         2) note.js 시작에서 applyFontSettings(DEFAULT_FONT_SETTINGS) 한 번,
            이어서 window.keepSticky.getFontSettings() 결과로 한 번 더,
         3) window.keepSticky.onFontSettings(...) 로 바뀔 때마다 다시 입히고,
         4) 아래 #title 은 var(--fs-title), #body 는 var(--fs-body) 를 쓴다 —
            포스트잇의 #title 이야말로 '제목 크기'가 원래 가리키던 곳이다.
       여기에 포스트잇만의 것이 하나 더 있다: 이 메모 한 장만의 재정의다
       ([모양] 패널). 전역 설정과 재정의를 합치는 규칙은 note-font.js 에 있고,
       합친 결과를 입히는 함수는 여전히 applyFontSettings() 하나다.

       applyFontSettings() 가 --font-ui / --fs-title / --fs-body 를 <html> 의
       인라인 스타일로 덮어쓰므로 세 벌짜리 :root 는 그대로 두어도 갈라지지
       않는다. 아래 값은 그 함수가 돌기 전까지의 기본값일 뿐이다 — 그래도 세
       벌은 항상 같은 값이어야 한다. */
    :root {
      --font-ui: system-ui, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      --fs-xs: 12px;
      --fs-sm: 13px;
      --fs-md: 15px;
      --fs-lg: 18px;
      --fs-title: 10pt; /* 사용자 설정 — 이 창에서는 제목 입력칸 */
      --fs-body: 9pt;   /* 사용자 설정 — 이 창에서는 본문 textarea */
      --lh-body: 1.7;
      --lh-tight: 1.35;
      --ink: rgba(0, 0, 0, 0.86);
      --ink-dim: rgba(0, 0, 0, 0.5);

      /* Keep 팔레트 12색. body 배경과 색상 피커의 스와치가 이 값을 함께 쓴다 —
         숫자를 두 곳에 따로 적으면 언젠가 어긋난다. */
      --c-white: #ffffff;   --c-red: #f6c8c2;    --c-orange: #fbd9a4; --c-yellow: #fdf6a9;
      --c-green: #dbeeb4;   --c-teal: #bfe8e0;    --c-blue: #c8e3f6;   --c-darkblue: #c6cbe9;
      --c-purple: #ddc9e9;  --c-pink: #f6cfe0;    --c-brown: #e4d3c1;  --c-gray: #e4e6e8;
    }

    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column;
      font-family: var(--font-ui);
      font-size: var(--fs-md);
      line-height: var(--lh-body);
      color: var(--ink);
      border-radius: 6px; overflow: hidden;
      word-break: keep-all; overflow-wrap: break-word;
      background: #fdf6a9; /* 기본값. Keep 색을 못 읽었을 때 쓰인다 */
    }

    /* Keep 의 노트 색(gkeepapi ColorValue 이름)을 그대로 배경으로 옮긴다.
       note.js 가 body.dataset.color 에 심는다 — 속성 값이므로 innerHTML 경로가
       아니고, 모르는 값이면 어느 규칙에도 걸리지 않아 위 기본값이 남는다.
       접힌 책갈피는 이 배경을 그대로 물려받는다. */
    body[data-color="White"]    { background: var(--c-white); }
    body[data-color="Red"]      { background: var(--c-red); }
    body[data-color="Orange"]   { background: var(--c-orange); }
    body[data-color="Yellow"]   { background: var(--c-yellow); }
    body[data-color="Green"]    { background: var(--c-green); }
    body[data-color="Teal"]     { background: var(--c-teal); }
    body[data-color="Blue"]     { background: var(--c-blue); }
    body[data-color="DarkBlue"] { background: var(--c-darkblue); }
    body[data-color="Purple"]   { background: var(--c-purple); }
    body[data-color="Pink"]     { background: var(--c-pink); }
    body[data-color="Brown"]    { background: var(--c-brown); }
    body[data-color="Gray"]     { background: var(--c-gray); }

    /* 상단 바 전체가 드래그 핸들이다. 버튼은 no-drag 로 되돌린다. */
    /* flex-wrap 이 필요한 이유는 목록 창의 header / footer 와 같다: 단추가 여덟
       개(체크·고정·보관·모양·삭제·압정·접기·✕)라 320px 짜리 기본 크기의
       포스트잇에서는 한 줄에 다 서지 못한다. 넘치면 아랫줄로 내려오는 편이
       [✕] 가 창 밖으로 밀려나 닿을 수 없게 되는 것보다 훨씬 낫다. */
    #bar { -webkit-app-region: drag; display: flex; align-items: center;
           flex-wrap: wrap; gap: 4px; padding: 7px 8px; font-size: var(--fs-xs);
           line-height: var(--lh-tight); color: var(--ink-dim); }
    #bar button { -webkit-app-region: no-drag; border: 0; background: transparent;
                  cursor: pointer; font-family: inherit; font-size: var(--fs-xs);
                  line-height: 1; padding: 5px 7px; border-radius: 5px; color: var(--ink-dim); }
    #bar button:hover { background: rgba(0, 0, 0, 0.08); color: var(--ink); }
    #bar button:disabled { opacity: 0.35; cursor: default; }
    #bar button:disabled:hover { background: transparent; }
    #close { font-size: var(--fs-sm); }
    /* 되돌리기 어려운 버튼은 눌렀을 때 무슨 일이 벌어지는지 색으로도 말한다.
       평상시에는 다른 버튼과 같은 무게로 두어 눈에 먼저 띄지 않게 한다. */
    #delete:hover { background: rgba(185, 28, 28, 0.14); color: #991b1b; }
    /* 상태 문구가 길어져도 버튼들을 밀어내지 않는다. 좁은 포스트잇에서는
       [접기]/[✕] 가 화면 밖으로 밀려나는 편이 훨씬 나쁘다. */
    #status { flex: 0 1 auto; min-width: 0; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
    #spacer { flex: 1; }
    /* 제목 입력칸. textarea 는 부분적으로 굵게 만들 수 없어서(균일 렌더링),
       제목은 본문과 분리된 한 줄짜리 <input> 이다 — 굵게, 본문보다 크게 만들어
       실제로 제목처럼 보이게 한다. box-sizing/width 를 명시하는 이유: <input>
       은 #body(textarea)와 달리 브라우저 기본 너비(문자 수 기준 intrinsic
       width)를 가질 수 있어, 플렉스의 stretch 만 믿지 않고 여기서 못 박는다. */
    #title { display: block; box-sizing: border-box; width: 100%;
             border: 0; outline: 0; padding: 8px 16px 2px;
             background: transparent; color: inherit;
             font-family: inherit; font-size: var(--fs-title); font-weight: 700;
             line-height: var(--lh-tight); }
    #title::placeholder { font-weight: 400; color: var(--ink-dim); }

    /* --- 본문: 줄 단위 편집기 ----------------------------------------------
       예전에는 여기가 <textarea> 한 칸이었다. 지금은 줄마다 자기 입력칸을
       갖는 목록이다 — 한 메모 안에서 평범한 글줄과 체크리스트 항목이 섞여야
       하는데, 한 칸짜리 textarea 는 균일하게 그려서 그 안의 일부에만 체크박스나
       취소선을 둘 수 없기 때문이다.

       contenteditable 이 아닌 이유: 한글 IME 조합 중에 캐럿이 튀고 글자가
       사라진다. 이 프로젝트가 이미 두 번 물러난 길이고, 제목이 별도 <input> 이
       된 것도 같은 이유다. <textarea> 안에서는 IME 가 정상으로 동작한다.

       줄 하나가 <input> 이 아니라 **한 줄짜리 <textarea>** 인 이유: <input> 은
       줄바꿈을 하지 못한다. 320px 짜리 포스트잇에서 긴 한국어 문장은 반드시
       접혀야 하는데, <input> 이면 옆으로 밀려 나가 읽을 수가 없다(메모를 여는
       가장 흔한 이유가 읽는 것이다). textarea 는 접히고, 높이는 note.js 의
       growLine() 이 내용에 맞춰 맞춘다 — 그래서 rows="1" 이지만 실제로는 필요한
       만큼 자란다. Enter 는 note.js 가 가로채 줄을 나누므로 값 안에 줄바꿈이
       들어가는 일은 없다.

       줄 글자는 Keep 에서 온 외부 데이터다. 값은 .value 로만 넣는다 —
       note.js 어디에도 innerHTML 은 없다.

       서체는 예전 본문과 같은 var(--fs-body) 와 font-family: inherit 을 쓴다.
       그래야 목록 창 [설정] 의 공통 서체와 이 메모만의 재정의가 모든 줄에
       그대로 적용된다(applyFontSettings 가 <html> 에 심는 토큰을 물려받는다). */
    /* scrollbar-gutter: stable 이 없으면, 스크롤막대가 나타나는 순간 내용 너비가
       ~15px 줄어 **모든** 줄이 다시 접힌다. 그런데 높이를 다시 맞추는 것은 그때
       글자를 치고 있던 줄 하나뿐이라, 나머지 줄들은 한 줄 높이인 채로 두 줄이
       되어 뒷부분이 잘린 채 보이지 않게 된다(.line-text 는 overflow: hidden 이다).
       자리를 늘 비워 두면 너비가 흔들리지 않아 그 경로 자체가 없어진다. */
    #body { flex: 1; overflow-y: auto; scrollbar-gutter: stable; padding: 2px 16px 14px; }
    /* baseline 이 아니라 flex-start 다. 접힌 줄(여러 줄로 자란 textarea)에서
       form 컨트롤의 baseline 은 브라우저마다 달라 체크박스가 가운데나 아래로
       떨어질 수 있다. 대신 첫 줄 높이의 한가운데에 오도록 여백으로 못 박는다.
       font-size 를 여기서 다시 정하는 것이 핵심이다 — 체크상자는 글자 크기를
       물려받지 않고 UA 기본값(≈13px)을 쓰므로, 그대로 두면 아래 1em 이 본문
       크기가 아니라 그 기본값으로 풀려 24pt 로 올린 노트에서 체크상자만 위로
       붕 뜬다. */
    .line { display: flex; align-items: flex-start; gap: 9px; }
    .line-check {
      flex: none; width: 15px; height: 15px; cursor: pointer;
      font-size: var(--fs-body);
      margin: calc((var(--lh-body) * 1em - 15px) / 2) 0 0;
    }
    /* overflow: hidden 이 필요하다 — 스크롤막대가 뜨면 scrollHeight 가 흔들려
       growLine() 의 높이 계산이 어긋난다. padding/border 를 0 으로 두고
       box-sizing 을 border-box 로 두는 것도 같은 이유다(scrollHeight 가 곧
       내용 높이여야 한다). */
    .line-text {
      flex: 1; min-width: 0; box-sizing: border-box;
      border: 0; outline: 0; padding: 0; margin: 0; resize: none; overflow: hidden;
      background: transparent; color: inherit;
      font-family: inherit; font-size: var(--fs-body); line-height: var(--lh-body);
      word-break: keep-all; overflow-wrap: break-word;
    }
    /* 체크된 줄은 글자에 줄을 긋고 흐리게 둔다. 남은 일이 무엇인지 한눈에 보여야
       체크리스트다. */
    .line.checked .line-text { color: var(--ink-dim); text-decoration: line-through; }
    /* 제목/본문을 아직(또는 영영) 불러오지 못한 상태. 비어 있는 채로 편집 가능하게
       열어두면 한 글자만 쳐도 Keep 의 원본이 그 한 글자로 덮인다. #body 는 이제
       <div> 라 [readonly] 선택자가 걸리지 않으므로 note.js 가 .locked 를 붙인다. */
    #title[readonly], #body.locked { color: rgba(0, 0, 0, 0.45); background: rgba(0, 0, 0, 0.04); cursor: default; }
    #body.locked .line-text { color: rgba(0, 0, 0, 0.45); cursor: default; }
    #badge { display: none; padding: 8px 16px; background: #f59e0b; color: #fff;
             font-size: var(--fs-xs); line-height: var(--lh-body); }
    #badge.show { display: block; }

    /* [모양] 패널. #bar 의 접기/✕ 와 다투지 않도록 같은 줄이 아니라 눌렀을 때만
       펼쳐지는 패널로 둔다 — 상시 노출하면 좁은 포스트잇에서 본문 자리를
       갉아먹는다.

       색과 서체를 한 패널에 같이 둔 이유는 상단 바가 이미 좁기 때문이다.
       [색상]과 [서체]를 따로 두면 버튼이 다섯 개가 되어 320px 짜리 기본 크기의
       포스트잇에서는 상태 문구가 설 자리가 없어진다. 둘 다 "이 메모가 어떻게
       보이는가"라서 한 곳에 있는 편이 찾기도 쉽다.

       max-height 로 본문을 완전히 덮지 않게 막는다. 패널이 열려 있어도 무슨
       메모인지 보여야 한다. */
    #lookToggle { font-size: var(--fs-xs); }
    /* 압정은 컬러 이모지라 다른 단추처럼 color 로는 흐려지지 않는다. 꺼진
       상태(항상 위 해제)는 opacity 로 표시한다. */
    /* 이미 보관된 메모(보관함에서 열어 본 것)에서는 [보관] 이 눌린 상태로
       보인다. 그 상태에서 누르면 해제다. */
    #archive[aria-pressed="true"],
    #pinned[aria-pressed="true"] {
      background: rgba(47, 111, 235, 0.16); color: #1b4bb8; font-weight: 600;
    }
    #pin { font-size: 13px; }
    #pin[aria-pressed="false"] { opacity: 0.35; }
    #pin[aria-pressed="false"]:hover { opacity: 0.7; }
    #lookPanel { display: none; padding: 2px 16px 10px; max-height: 55%;
                 overflow-y: auto; -webkit-app-region: no-drag; }
    #lookPanel.show { display: block; }
    #colorPicker { display: flex; flex-wrap: wrap; gap: 7px; }
    #colorPicker button.swatch {
      width: 20px; height: 20px; padding: 0; border-radius: 50%; cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.22);
    }
    #colorPicker button.swatch.current {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(0, 0, 0, 0.55);
    }
    /* 불러오기가 끝나기 전에는 색을 고를 수 없다 — 색 저장도 update_note 경로라
       본문을 못 받은 상태에서 보내면 안 된다. 서체는 Keep 을 거치지 않으므로
       (state.json 에만 산다) 같은 패널 안에서도 계속 쓸 수 있다. */
    #colorPicker button.swatch:disabled { opacity: 0.35; cursor: default; }
    #colorPicker button.swatch[data-color="White"]    { background: var(--c-white); }
    #colorPicker button.swatch[data-color="Red"]      { background: var(--c-red); }
    #colorPicker button.swatch[data-color="Orange"]   { background: var(--c-orange); }
    #colorPicker button.swatch[data-color="Yellow"]   { background: var(--c-yellow); }
    #colorPicker button.swatch[data-color="Green"]    { background: var(--c-green); }
    #colorPicker button.swatch[data-color="Teal"]     { background: var(--c-teal); }
    #colorPicker button.swatch[data-color="Blue"]     { background: var(--c-blue); }
    #colorPicker button.swatch[data-color="DarkBlue"] { background: var(--c-darkblue); }
    #colorPicker button.swatch[data-color="Purple"]   { background: var(--c-purple); }
    #colorPicker button.swatch[data-color="Pink"]     { background: var(--c-pink); }
    #colorPicker button.swatch[data-color="Brown"]    { background: var(--c-brown); }
    #colorPicker button.swatch[data-color="Gray"]     { background: var(--c-gray); }

    /* 같은 [모양] 패널의 서체 줄. 라벨과 입력칸이 한 줄에 서고, 좁아지면
       줄바꿈된다 — 포스트잇은 사용자가 마음대로 좁힐 수 있는 창이다. 입력칸의
       글자 크기는 --fs-xs 고정이다: 여기서 --fs-body 를 쓰면 6pt 를 고른 순간
       그 값을 되돌릴 입력칸까지 같이 작아져 다시 누르기 어려워진다. */
    .look-row { display: flex; align-items: center; flex-wrap: wrap;
                gap: 6px; margin-top: 9px; }
    .look-row label { color: var(--ink-dim); font-size: var(--fs-xs);
                      line-height: var(--lh-tight); }
    .look-row select, .look-row input {
      -webkit-app-region: no-drag;
      font-family: inherit; font-size: var(--fs-xs); line-height: 1.4;
      padding: 3px 5px; border: 1px solid rgba(0, 0, 0, 0.22); border-radius: 4px;
      background: rgba(255, 255, 255, 0.65); color: var(--ink);
    }
    .look-row select { flex: 1; min-width: 0; }
    .look-row input[type="number"] { width: 52px; }
    .look-row .unit { color: var(--ink-dim); font-size: var(--fs-xs); }
    #note-font-reset { -webkit-app-region: no-drag; border: 1px solid rgba(0, 0, 0, 0.22);
                       background: rgba(255, 255, 255, 0.65); cursor: pointer;
                       font-family: inherit; font-size: var(--fs-xs); line-height: 1.4;
                       padding: 4px 8px; border-radius: 4px; color: var(--ink-dim); }
    #note-font-reset:hover { background: #fff; color: var(--ink); }

    /* --- 접힌 모습(책갈피) -------------------------------------------------
       창 전체가 화면 오른쪽 가장자리에 붙은 좁은 세로 띠가 된다. 배경은 위
       body 규칙에서 그대로 온다. 눌러서 펼쳐야 하므로 드래그 영역이 아니다. */
    #bookmark { display: none; }
    body.folded #bar, body.folded #badge, body.folded #title, body.folded #body,
    body.folded #lookPanel { display: none; }
    body.folded #bookmark {
      -webkit-app-region: no-drag;
      display: flex; flex: 1; justify-content: center;
      padding: 9px 2px; overflow: hidden; cursor: pointer;
      /* 왼쪽의 굵은 선은 "여기가 잡는 곳"이라는 표시다. 위쪽 가는 선은 장과
         장의 경계다 — 책갈피는 사이 간격 없이 딱 붙어 쌓이므로(bookmark-layout.js)
         이 선이 없으면 같은 색 메모 두 장이 한 장으로 보인다. */
      box-shadow: inset 2px 0 0 rgba(0, 0, 0, 0.12),
                  inset 0 1px 0 rgba(0, 0, 0, 0.22);
    }
    body.folded #bookmark:hover {
      box-shadow: inset 3px 0 0 rgba(0, 0, 0, 0.28),
                  inset 0 1px 0 rgba(0, 0, 0, 0.22);
    }
    /* 끄는 동안. 문턱(4px)을 넘긴 뒤에야 이 클래스가 붙으므로, 펼치려고 톡
       누른 것은 계속 pointer 커서로 남는다. */
    body.folded.dragging #bookmark { cursor: grabbing; }
    #bookmark-label {
      font-size: 14px; line-height: 1.32; text-align: center; color: var(--ink);
      font-weight: 600;
    }
    /* 한 줄에 한 글자. 공백 글자도 자리를 차지해야 낱말 구분이 보인다. */
    #bookmark-label span { display: block; min-height: 1em; }
    /* 위 #bookmark-label 의 font-size 는 일부러 14px 고정이다 — var(--fs-body)
       를 쓰면 서체를 24pt 로 올린 노트의 책갈피 글자가 44px 짜리 띠를 뚫고
       나간다. 글꼴(font-family)만 body 에서 물려받아 노트의 서체를 따른다. */
  </style>
</head>
<body>
  <!-- 왼쪽은 '이 메모'에 하는 일(모양 바꾸기, 지우기), 오른쪽은 '이 창'에 하는
       일(접기, 내리기)이다. 그 사이를 #spacer 가 벌린다. [삭제] 를 굳이 왼쪽
       묶음에 둔 이유가 이 구분이고, 덤으로 ✕ 에서 제일 멀어진다 — 되돌리기 어려운
       버튼과 하루에도 몇 번씩 누르는 버튼이 붙어 있을 이유가 없다. -->
  <div id="bar">
    <!-- [체크] 는 **캐럿이 있는 그 줄 하나**를 체크리스트 항목으로 만들고, 다시
         누르면 평범한 글줄로 되돌린다. 체크리스트는 메모 전체의 종류가 아니라
         줄 하나하나의 성질이다 — 쓰다가 필요한 자리에 붙이는 것이다.
         Ctrl+L 로도 같은 일을 한다. 왼쪽 묶음의 맨 앞에 두어 [삭제] 의 이웃을
         바꾸지 않는다(되돌리기 어려운 버튼 옆에 자주 누르는 버튼을 새로 붙이지
         않는다). -->
    <button id="lineToggle" title="이 줄을 체크리스트 항목으로 만들기 / 되돌리기 (Ctrl+L)" disabled>체크</button>
    <!-- [보관] 은 Keep 의 '보관처리'다. 지우는 것이 아니라 치워 두는 것이고,
         누르면 이 포스트잇도 바탕화면에서 내려간다(Keep 메모는 그대로 남는다).
         목록 창의 [보관함] 에서 다시 찾을 수 있다.
         **[삭제] 옆에 두지 않는다.** 이 줄 위 주석의 원칙 그대로다 — 되돌리기
         어려운 버튼 옆에 자주 누르는 버튼을 붙이지 않는다. 그래서 [모양] 이
         [삭제] 의 왼쪽 이웃 자리를 그대로 지킨다. -->
    <!-- Keep 의 '고정됨'이다. 목록에서 맨 위 묶음으로 올라간다. 오른쪽의 압정(📌)
         과는 다른 것이다 — 저쪽은 이 PC 의 창을 다른 창 위에 띄울지일 뿐이고,
         이것은 Keep 노트의 필드라 폰과 웹에도 그대로 간다. -->
    <button id="pinned" title="Keep 에서 고정하기 (목록 맨 위로)" aria-pressed="false" disabled>고정</button>
    <button id="archive" title="이 메모를 보관 처리하기" aria-pressed="false" disabled>보관</button>
    <button id="lookToggle" title="이 메모의 색과 서체" disabled>모양</button>
    <button id="delete" title="이 메모를 Keep 휴지통으로 보내기 (7일간 복구할 수 있습니다)" disabled>삭제</button>
    <span id="status"></span>
    <span id="spacer"></span>
    <!-- 압정. 오른쪽 묶음('이 창'에 하는 일)에 든다. 눌린 상태가 기본이다 —
         이 단추가 생기기 전에는 모든 포스트잇이 예외 없이 항상 위에 떠 있었다. -->
    <button id="pin" title="항상 위에 보이기 (끄면 다른 창 뒤로 갈 수 있습니다)"
            aria-pressed="true">📌</button>
    <button id="fold" title="책갈피로 접기 (화면 가장자리에 붙습니다)">접기</button>
    <button id="close" title="바탕화면에서 내리기 (Keep 메모는 유지됩니다)">✕</button>
  </div>
  <!-- [모양] 패널: 노트 색 + 이 메모만의 서체.
       스와치는 note.js 가 createElement 로 12개를 직접 만든다. 이름표(title)는
       우리가 하드코딩한 한국어 문구일 뿐 Keep 데이터가 아니지만, 여기서도
       innerHTML 은 쓰지 않는다. <option> 도 마찬가지다 — 글꼴 이름은 사용자가
       고른 값이 아니라 표에 있는 것이지만, 문자열을 이어붙여 innerHTML 에 넣는
       경로는 이 앱 어디에도 두지 않는다.
       서체는 이 메모 한 장에만 적용되고 Keep 에는 저장되지 않는다(Keep 에 서체
       필드가 없다). 비워 두면 그 항목은 목록 창 [설정] 의 공통 값을 따른다 —
       공통 값이 바뀌면 곧바로 같이 바뀐다. -->
  <div id="lookPanel">
    <div id="colorPicker" role="group" aria-label="노트 색상"></div>
    <div class="look-row">
      <label for="note-font-family">글꼴</label>
      <select id="note-font-family"></select>
    </div>
    <div class="look-row">
      <label for="note-font-title-size">제목</label>
      <!-- min/max 는 font-settings.js 의 FONT_PT_RANGE 에서 note.js 가 채운다.
           여기 숫자를 또 적으면 두 곳이 언젠가 갈라진다. 빈 칸 = 공통 설정
           따름이고, 그때 placeholder 로 공통 값이 몇인지 보여준다. -->
      <input id="note-font-title-size" type="number" step="1" inputmode="numeric"><span class="unit">pt</span>
      <label for="note-font-body-size">본문</label>
      <input id="note-font-body-size" type="number" step="1" inputmode="numeric"><span class="unit">pt</span>
    </div>
    <div class="look-row">
      <button id="note-font-reset" type="button" title="이 메모만의 서체를 지우고 목록 창 [설정] 의 값을 따릅니다">공통 설정 따르기</button>
    </div>
  </div>
  <div id="badge"></div>
  <!-- 불러오기가 성공해야만 note.js 가 readonly 를 푼다. 기본값이 편집 가능이면
       느린 로딩 중에 친 글자가 Keep 원본을 덮어쓰는 경로가 열린다.
       title/text 는 Keep 의 원래 두 필드 그대로다 — 하나로 합쳤다가 저장할 때
       다시 쪼개던 예전 방식은 없앴다. 그 방식은 텍스트로만 이루어진 <textarea>
       한 칸 안에서 첫 줄을 제목으로 흉내 내려던 것이었는데, textarea 는 일부만
       굵게 렌더링할 수 없다. 제목을 실제로 굵고 크게 보여주려면 별개의 컨트롤이
       필요했다. -->
  <input id="title" type="text" placeholder="제목" spellcheck="false" readonly>
  <!-- 본문. note.js 가 줄마다 한 줄짜리 <textarea> 를 createElement 로 만든다 —
       줄 글자는 Keep 에서 온 외부 데이터이므로 innerHTML 을 쓰지 않고 .value 로만
       넣는다.

       체크리스트는 이 본문 **안의 텍스트 규약**이다. "- [ ] 우유" 는 체크 안 된
       항목, "- [x] 빵" 은 체크된 항목이고, 그 밖의 줄은 평범한 글이다. 규칙과
       왕복 보장은 line-model.js 에 있다. Keep 의 노트는 Note 이거나 List 이고
       한 메모 안에서 글과 체크박스가 공존할 수 없어서(Note 에는 항목을 추가하는
       메서드가 없고 둘 사이 변환 경로도 없다) 택한 길이다 — 폰의 Keep 앱에서는
       평범한 글줄로 보이고, 그것이 받아들인 대가다.

       폰에서 만든 **진짜 List 노트**도 같은 편집기에 그린다(모든 줄이 항목이다).
       체크리스트 UI 를 두 벌 두지 않는다. 다만 그쪽은 줄을 더하거나 뺄 수 없다 —
       사이드카의 update_checklist 가 항목 id 로만 짝을 찾기 때문이다.

       Ctrl+클릭으로 주소를 열 수 있다. 입력칸에는 링크 요소가 없어서 누를
       것도 꾸밀 것도 없다 — 클릭이 캐럿을 옮긴다는 사실을 거꾸로 이용해 그 줄의
       selectionStart 에서 좌우로 뻗어 주소를 찾는다(url-open.js). 주소에는 공백이
       들어갈 수 없으므로 줄을 넘어가는 주소도 없다. 그냥 클릭이 아니라 Ctrl+클릭인
       이유는 평범한 클릭이 여전히 글자 사이에 커서를 놓아야 하기 때문이다. -->
  <div id="body" class="locked"></div>
  <!-- 접었을 때만 보인다. 세로 글자는 note.js 가 createElement 로 한 글자씩
       만든다 — Keep 제목은 외부 데이터이므로 innerHTML 을 쓰지 않는다. -->
  <div id="bookmark" title="펼치기"><div id="bookmark-label"></div></div>
  <!-- 순서가 중요하다. 아래 일곱은 전부 note.js 보다 먼저 와야 한다 — 순수 함수와
       상수가 여기서 전역으로 걸리고, note.js 는 require() 없이 그 전역을 그대로
       쓴다(contextIsolation 렌더러라 require 가 없다). note-font.js 는 다시
       font-settings.js 의 FONT_CHOICES / clampPt / normalizeFontSettings 를
       쓰므로 그보다 뒤여야 한다. line-model.js / undo-stack.js /
       checklist-items.js / url-open.js 는 서로도, 다른 어느 것도 참조하지 않으므로
       note.js 보다 앞이기만 하면 된다. -->
  <script src="bookmark-text.js"></script>
  <script src="line-model.js"></script>
  <script src="undo-stack.js"></script>
  <script src="checklist-items.js"></script>
  <script src="url-open.js"></script>
  <script src="font-settings.js"></script>
  <script src="note-font.js"></script>
  <script src="note.js"></script>
</body>
</html>
