<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>메모</title>
  <style>
    /* 서체 토큰. list.html / setup-email.html 과 같은 값이다. style-src 가
       'unsafe-inline' 뿐이라 공통 .css 파일을 <link> 로 못 부른다. 웹폰트도
       쓰지 않는다 — 이 앱은 오프라인에서 떠야 한다. */
    :root {
      --font-ui: system-ui, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      --fs-xs: 12px;
      --fs-sm: 13px;
      --fs-md: 15px;
      --lh-body: 1.7;
      --lh-tight: 1.35;
      --ink: rgba(0, 0, 0, 0.86);
      --ink-dim: rgba(0, 0, 0, 0.5);
    }

    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column;
      font-family: var(--font-ui);
      font-size: var(--fs-md);
      line-height: var(--lh-body);
      color: var(--ink);
      border-radius: 6px; overflow: hidden;
      word-break: keep-all; overflow-wrap: break-word;
      background: #fdf6a9; /* 기본값. Keep 색을 못 읽었을 때 쓰인다 */
    }

    /* Keep 의 노트 색(gkeepapi ColorValue 이름)을 그대로 배경으로 옮긴다.
       note.js 가 body.dataset.color 에 심는다 — 속성 값이므로 innerHTML 경로가
       아니고, 모르는 값이면 어느 규칙에도 걸리지 않아 위 기본값이 남는다.
       접힌 책갈피는 이 배경을 그대로 물려받는다. */
    body[data-color="White"]    { background: #ffffff; }
    body[data-color="Red"]      { background: #f6c8c2; }
    body[data-color="Orange"]   { background: #fbd9a4; }
    body[data-color="Yellow"]   { background: #fdf6a9; }
    body[data-color="Green"]    { background: #dbeeb4; }
    body[data-color="Teal"]     { background: #bfe8e0; }
    body[data-color="Blue"]     { background: #c8e3f6; }
    body[data-color="DarkBlue"] { background: #c6cbe9; }
    body[data-color="Purple"]   { background: #ddc9e9; }
    body[data-color="Pink"]     { background: #f6cfe0; }
    body[data-color="Brown"]    { background: #e4d3c1; }
    body[data-color="Gray"]     { background: #e4e6e8; }

    /* 상단 바 전체가 드래그 핸들이다. 버튼은 no-drag 로 되돌린다. */
    #bar { -webkit-app-region: drag; display: flex; align-items: center;
           gap: 4px; padding: 7px 8px; font-size: var(--fs-xs);
           line-height: var(--lh-tight); color: var(--ink-dim); }
    #bar button { -webkit-app-region: no-drag; border: 0; background: transparent;
                  cursor: pointer; font-family: inherit; font-size: var(--fs-xs);
                  line-height: 1; padding: 5px 7px; border-radius: 5px; color: var(--ink-dim); }
    #bar button:hover { background: rgba(0, 0, 0, 0.08); color: var(--ink); }
    #close { font-size: var(--fs-sm); }
    #spacer { flex: 1; }
    #body { flex: 1; border: 0; outline: 0; resize: none; padding: 4px 16px 14px;
            background: transparent; color: inherit;
            font-family: inherit; font-size: var(--fs-md); line-height: var(--lh-body);
            word-break: keep-all; overflow-wrap: break-word; }
    /* 본문을 아직(또는 영영) 불러오지 못한 상태. 비어 있는 본문을 편집 가능한
       채로 열어두면 한 글자만 쳐도 Keep 의 원본이 그 한 글자로 덮인다. */
    #body[readonly] { color: rgba(0, 0, 0, 0.45); background: rgba(0, 0, 0, 0.04); cursor: default; }
    #badge { display: none; padding: 8px 16px; background: #f59e0b; color: #fff;
             font-size: var(--fs-xs); line-height: var(--lh-body); }
    #badge.show { display: block; }

    /* --- 접힌 모습(책갈피) -------------------------------------------------
       창 전체가 화면 오른쪽 가장자리에 붙은 좁은 세로 띠가 된다. 배경은 위
       body 규칙에서 그대로 온다. 눌러서 펼쳐야 하므로 드래그 영역이 아니다. */
    #bookmark { display: none; }
    body.folded #bar, body.folded #badge, body.folded #body { display: none; }
    body.folded #bookmark {
      -webkit-app-region: no-drag;
      display: flex; flex: 1; justify-content: center;
      padding: 9px 2px; overflow: hidden; cursor: pointer;
      box-shadow: inset 2px 0 0 rgba(0, 0, 0, 0.12);
    }
    body.folded #bookmark:hover { box-shadow: inset 3px 0 0 rgba(0, 0, 0, 0.28); }
    #bookmark-label {
      font-size: 14px; line-height: 1.32; text-align: center; color: var(--ink);
      font-weight: 600;
    }
    /* 한 줄에 한 글자. 공백 글자도 자리를 차지해야 낱말 구분이 보인다. */
    #bookmark-label span { display: block; min-height: 1em; }
  </style>
</head>
<body>
  <div id="bar">
    <span id="status"></span>
    <span id="spacer"></span>
    <button id="fold" title="책갈피로 접기 (화면 오른쪽 가장자리에 붙습니다)">접기</button>
    <button id="close" title="바탕화면에서 내리기 (Keep 메모는 유지됩니다)">✕</button>
  </div>
  <div id="badge"></div>
  <!-- 불러오기가 성공해야만 note.js 가 readonly 를 푼다. 기본값이 편집 가능이면
       느린 로딩 중에 친 글자가 Keep 원본을 덮어쓰는 경로가 열린다. -->
  <textarea id="body" spellcheck="false" readonly></textarea>
  <!-- 접었을 때만 보인다. 세로 글자는 note.js 가 createElement 로 한 글자씩
       만든다 — Keep 제목은 외부 데이터이므로 innerHTML 을 쓰지 않는다. -->
  <div id="bookmark" title="펼치기"><div id="bookmark-label"></div></div>
  <script src="note.js"></script>
</body>
</html>
